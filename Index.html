<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Domácí spotřebiče</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&display=swap">
<style>
:root{--bg:#E8ECEE;--sf:#F7F9FA;--ink:#1B2530;--on:#fff;--mut:#5A6874;--ln:#C7D0D6;--lcd:#18222B;--glow:#FFB547;--hi:#FFE6B3;--hi2:#FFF3D9;--teal:#2B7A8C;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171D;--sf:#1A242D;--ink:#E7EDF1;--on:#10171D;--mut:#9AA9B5;--ln:#31404B;--lcd:#080C10;--hi:#5A4413;--hi2:#33290F;--teal:#5BB3C6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10171D;--sf:#1A242D;--ink:#E7EDF1;--on:#10171D;--mut:#9AA9B5;--ln:#31404B;--lcd:#080C10;--hi:#5A4413;--hi2:#33290F;--teal:#5BB3C6;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 Barlow,"Segoe UI",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 56px}
h1{font-size:2rem;line-height:1.1;font-weight:700;margin:8px 0 6px}
h2{font-size:1.15rem;margin:0 0 8px}
.sub{color:var(--mut);margin:0 0 20px}
.home{display:grid;gap:12px}
.tile{width:100%;text-align:left;font:inherit;color:inherit;background:var(--sf);border:1px solid var(--ln);border-left:8px solid var(--glow);border-radius:14px;padding:22px 20px;cursor:pointer}
.tile.w{border-left-color:var(--teal)}
.tile b{display:block;font-size:1.7rem;font-weight:700}
.tile span{color:var(--mut)}
.back{font:inherit;color:var(--mut);background:none;border:0;padding:10px 0;cursor:pointer}
.step{margin:22px 0 8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:999px;padding:9px 16px;min-height:44px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on);border-color:var(--ink)}
input{font:inherit;font-size:1.4rem;width:9rem;padding:8px 12px;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:10px}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.lcd{margin-top:26px;background:var(--lcd);color:var(--glow);border-radius:14px;padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.lcd small{display:block;font-size:.95rem;opacity:.7}
.lcd strong{display:block;font-size:2.4rem;line-height:1.05;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.lcd em{display:block;font-style:normal;font-size:.9rem;opacity:.8}
.lcd p{grid-column:1/-1;margin:0}
.lcd .ph{opacity:.75}
.lcd .w{color:#FF9A8A}
.lcd .n{font-size:.9rem;opacity:.8}
#thicknessHint{margin:6px 0 0;color:var(--mut);font-size:.88rem}
.gap{height:calc(4*1.5em)}
.tw{overflow-x:auto;background:var(--sf);border:1px solid var(--ln);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--ln)}
th{font-weight:600;background:var(--bg)}
th.col,td.col{background:var(--hi2)}
tr.hit td{background:var(--hi);font-weight:600}
tr.hit td.col{background:var(--glow);color:#1B2530}
</style>

  <!-- Ikony aplikace: cesty relativní ke složce /Grill_helper/ -->
  <link rel="icon" type="image/png" sizes="192x192" href="/Grill_helper/icon-192.png?v=2">
  <link rel="icon" type="image/png" sizes="512x512" href="/Grill_helper/icon-512.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="/Grill_helper/apple-touch-icon.png?v=2">
  <link rel="manifest" href="/Grill_helper/manifest.webmanifest?v=2">
  <meta name="theme-color" content="#0B1B3A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Grill Helper">

</head>
<body>
<main>
<section id="home">
<h1>Domácí spotřebiče</h1>
<p class="sub">Vyberte spotřebič a zjistěte správné nastavení.</p>
<div class="home">
<button class="tile" onclick="show('grill')"><b>Grill</b><span>Teplota a doba podle funkce, tloušťky a propečení</span></button>
<button class="tile w" onclick="show('pracka')"><b>Pračka</b><span>Sekce se připravuje</span></button>
</div>
</section>

<section id="grill" hidden>
<button class="back" onclick="show('home')">← Spotřebiče</button>
<h1>Grill</h1>
<div class="step">1. Funkce</div>
<div class="chips" id="fn"></div>
<div class="step"><label for="t">2. Tloušťka v mm</label></div>
<input id="t" type="number" inputmode="numeric" min="0" max="50" step="1" placeholder="např. 15" aria-describedby="thicknessHint">
<p id="thicknessHint" class="n" aria-live="polite"></p>
<div class="step">3. Stupeň propečení</div>
<div class="chips" id="lv"></div>
<div class="lcd" id="out" aria-live="polite"></div>
<div id="tabbox"></div>
</section>

<section id="pracka" hidden>
<button class="back" onclick="show('home')">← Spotřebiče</button>
<h1>Pračka</h1>
<p class="sub">Tato sekce je zatím prázdná.</p>
</section>
</main>
<script>
const D={"Chléb":{"h":["Funkce","Tloušťka","Teplota","Krvavé (s)","Středně krvavé (s)","Středně propečené (s)","Dobře propečené (s)"],"r":[["0-10","200 °C","70","140(+70)","210(+70)","280(+210)"],["11","200 °C","75","145(+70)","215(+70)","285(+210)"],["12","200 °C","75","145(+70)","215(+70)","285(+210)"],["13","200 °C","75","145(+70)","215(+70)","285(+210)"],["14","200 °C","75","145(+70)","215(+70)","285(+210)"],["15","200 °C","75","145(+70)","215(+70)","285(+210)"],["16","200 °C","80","150(+70)","220(+70)","290(+210)"],["17","200 °C","80","150(+70)","220(+70)","290(+210)"],["18","200 °C","80","150(+70)","220(+70)","290(+210)"],["19","200 °C","80","150(+70)","220(+70)","290(+210)"],["20","200 °C","80","150(+70)","220(+70)","290(+210)"],["21","200 °C","85","155(+70)","225(+70)","295(+210)"],["22","200 °C","85","155(+70)","225(+70)","295(+210)"],["23","200 °C","85","155(+70)","225(+70)","295(+210)"],["24","200 °C","85","155(+70)","225(+70)","295(+210)"],["25-30","200 °C","85","155(+70)","225(+70)","295(+210)"],["31-50","200 °C","90","160(+70)","230(+70)","300(+210)"]]},"Steak":{"h":["Funkce","Tloušťka","Teplota","Krvavé (s)","Středně krvavé (s)","Středně propečené (s)","Dobře propečené (s)"],"r":[["0-20","230 °C","180","210(+30)","290(+80)","370(+190)"],["21-25","230 °C","270","310(+40)","390(+80)","480(+210)"],["26-34","230 °C","330","370(+40)","450(+80)","540(+210)"],["35-50","230 °C","510","560(+50)","640(+80)","740(+230)"]]},"Kuře":{"h":["Funkce","Tloušťka","Teplota","Krvavé (s)","Středně krvavé (s)","Středně propečené (s)","Dobře propečené (s)"],"r":[["0-10","230 °C","60","160(+100)","260(+100)","310(+250)"],["11","230 °C","70","170(+100)","270(+100)","320(+250)"],["12","230 °C","80","180(+100)","280(+100)","330(+250)"],["13","230 °C","90","190(+100)","290(+100)","340(+250)"],["14","230 °C","100","200(+100)","300(+100)","350(+250)"],["15","230 °C","110","210(+100)","310(+100)","360(+250)"],["16","230 °C","120","220(+100)","320(+100)","370(+250)"],["17","230 °C","130","230(+100)","330(+100)","380(+250)"],["18","230 °C","140","240(+100)","340(+100)","390(+250)"],["19","230 °C","150","250(+100)","350(+100)","400(+250)"],["20","230 °C","160","260(+100)","360(+100)","410(+250)"],["21","230 °C","170","270(+100)","370(+100)","420(+250)"],["22","230 °C","180","280(+100)","380(+100)","430(+250)"],["23","230 °C","190","290(+100)","390(+100)","440(+250)"],["24","230 °C","200","300(+100)","400(+100)","450(+250)"],["25-30","230 °C","210","310(+100)","410(+100)","460(+250)"],["31-50","230 °C","220","320(+100)","420(+100)","470(+250)"]]},"Ryba":{"h":["Funkce","Tloušťka","Teplota","Krvavé (s)","Středně krvavé (s)","Středně propečené (s)","Dobře propečené (s)"],"r":[["0-10","210 °C","70","150(+80)","230(+80)","310(+240)"],["11","210 °C","80","160(+80)","240(+80)","320(+240)"],["12","210 °C","90","170(+80)","250(+80)","330(+240)"],["13","210 °C","100","180(+80)","260(+80)","340(+240)"],["14","210 °C","110","190(+80)","270(+80)","350(+240)"],["15","210 °C","120","200(+80)","280(+80)","360(+240)"],["16","210 °C","130","210(+80)","290(+80)","370(+240)"],["17","210 °C","140","220(+80)","300(+80)","380(+240)"],["18","210 °C","150","230(+80)","310(+80)","390(+240)"],["19","210 °C","160","240(+80)","320(+80)","400(+240)"],["20","210 °C","170","250(+80)","330(+80)","410(+240)"],["21","210 °C","180","260(+80)","340(+80)","420(+240)"],["22","210 °C","190","270(+80)","350(+80)","430(+240)"],["23","210 °C","200","280(+80)","360(+80)","440(+240)"],["24","210 °C","210","290(+80)","370(+80)","450(+240)"],["25-30","210 °C","220","300(+80)","380(+80)","460(+240)"],["31-50","210 °C","230","310(+80)","390(+80)","470(+240)"]]},"Párek":{"h":["Funkce","Tloušťka","Teplota","Krvavé (s)","Středně krvavé (s)","Středně propečené (s)","Dobře propečené (s)"],"r":[["0-10","210 °C","55","155(+100)","205(+50)","235(+180)"],["11","210 °C","60","160(+100)","210(+50)","240(+180)"],["12","210 °C","65","165(+100)","215(+50)","245(+180)"],["13","210 °C","70","170(+100)","220(+50)","250(+180)"],["14","210 °C","75","175(+100)","225(+50)","255(+180)"],["15","210 °C","80","180(+100)","230(+50)","260(+180)"],["16","210 °C","85","185(+100)","235(+50)","265(+180)"],["17","210 °C","90","190(+100)","240(+50)","270(+180)"],["18","210 °C","100","200(+100)","250(+50)","280(+180)"],["19","210 °C","110","210(+100)","260(+50)","290(+180)"],["20","210 °C","120","220(+100)","270(+50)","300(+180)"],["21","210 °C","130","230(+100)","280(+50)","310(+180)"],["22","210 °C","140","240(+100)","290(+50)","320(+180)"],["23","210 °C","150","250(+100)","300(+50)","330(+180)"],["24","210 °C","160","260(+100)","310(+50)","340(+180)"],["25-30","210 °C","170","270(+100)","320(+50)","350(+180)"],["31-50","210 °C","180","280(+100)","330(+50)","360(+180)"]]},"Slanina":{"h":["Funkce","Tloušťka","Teplota","Krvavé (s)","Středně krvavé (s)","Středně propečené (s)","Dobře propečené (s)"],"r":[["0-10","230 °C","80","105(+25)","130(+25)","155(+75)"],["11","230 °C","85","110(+25)","135(+25)","160(+75)"],["12","230 °C","90","115(+25)","140(+25)","165(+75)"],["13","230 °C","95","120(+25)","145(+25)","170(+75)"],["14","230 °C","100","125(+25)","150(+25)","175(+75)"],["15","230 °C","105","130(+25)","155(+25)","180(+75)"],["16","230 °C","110","135(+25)","160(+25)","185(+75)"],["17","230 °C","115","140(+25)","165(+25)","190(+75)"],["18","230 °C","120","145(+25)","170(+25)","195(+75)"],["19","230 °C","125","150(+25)","175(+25)","200(+75)"],["20","230 °C","130","155(+25)","180(+25)","205(+75)"],["21","230 °C","135","160(+25)","185(+25)","210(+75)"],["22","230 °C","140","165(+25)","190(+25)","215(+75)"],["23","230 °C","145","170(+25)","195(+25)","220(+75)"],["24","230 °C","150","175(+25)","200(+25)","225(+75)"],["25-30","230 °C","155","180(+25)","205(+25)","230(+75)"],["31-50","230 °C","160","185(+25)","210(+25)","235(+75)"]]},"Hamburger":{"h":["Funkce","Tloušťka","Teplota","Krvavé (s)","Středně krvavé (s)","Středně propečené (s)","Dobře propečené (s)"],"r":[["0-10","200 °C","60","160(+100)","260(+100)","310(+250)"],["11","200 °C","70","170(+100)","270(+100)","320(+250)"],["12","200 °C","80","180(+100)","280(+100)","330(+250)"],["13","200 °C","90","190(+100)","290(+100)","340(+250)"],["14","200 °C","100","200(+100)","300(+100)","350(+250)"],["15","200 °C","110","210(+100)","310(+100)","360(+250)"],["16","200 °C","120","220(+100)","320(+100)","370(+250)"],["17","200 °C","130","230(+100)","330(+100)","380(+250)"],["18","200 °C","140","240(+100)","340(+100)","390(+250)"],["19","200 °C","150","250(+100)","350(+100)","400(+250)"],["20","200 °C","160","260(+100)","360(+100)","410(+250)"],["21","200 °C","170","270(+100)","370(+100)","420(+250)"],["22","200 °C","180","280(+100)","380(+100)","430(+250)"],["23","200 °C","190","290(+100)","390(+100)","440(+250)"],["24","200 °C","200","300(+100)","400(+100)","450(+250)"],["25-30","200 °C","210","310(+100)","410(+100)","460(+250)"],["31-50","200 °C","220","320(+100)","420(+100)","470(+250)"]]}},$=s=>document.querySelector(s),S={fn:null,t:null,lv:null},K=Object.keys(D);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rng=s=>{const p=String(s).split('-').map(Number);return[p[0],p[p.length-1]]};
const fmt=s=>{const m=Math.floor(s/60),r=s%60;return m?m+' min'+(r?' '+r+' s':''):r+' s'};
function find(rows,t){
 const i=rows.findIndex(r=>{const[a,b]=rng(r[0]);return t>=a&&t<=b});
 if(i>=0)return{i,ok:1};
 let best=0,bd=1e9;
 rows.forEach((r,k)=>{const[a,b]=rng(r[0]),d=t<a?a-t:t-b;if(d<bd||(d===bd&&t<a)){bd=d;best=k}});
 return{i:best,ok:0};
}
function show(id){['home','grill','pracka'].forEach(v=>$('#'+v).hidden=v!==id);scrollTo(0,0)}
function mk(el,items,key){items.forEach((x,i)=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=x;b.onclick=()=>{S[key]=key==='fn'?x:i;render()};el.append(b)})}
function mark(el,key){[...el.children].forEach((b,i)=>b.setAttribute('aria-pressed',key==='fn'?b.textContent===S.fn:i===S.lv))}
function render(){
 mark($('#fn'),'fn');mark($('#lv'),'lv');
 const fHint=D[S.fn];
 $('#thicknessHint').textContent=fHint?'Dostupné rozsahy: '+fHint.r.map(r=>r[0]).join(', ')+' mm.':'Nejprve vyberte funkci.';
 const f=D[S.fn];let hit=-1,note='';
 if(f&&S.t!=null){
  if(S.t<0||S.t>50)note='Tabulka platí pro tloušťku 0–50 mm.';
  else{const r=find(f.r,S.t);hit=r.i;if(!r.ok)note='Pro '+S.t+' mm tabulka nemá vlastní řádek, použit nejbližší: '+f.r[hit][0]+' mm.'}
 }
 let h;
 if(hit>=0&&S.lv!=null){
  const row=f.r[hit],v=row[2+S.lv],s=parseInt(v),d=(v.match(/\(\+(\d+)\)/)||[])[1];
  h='<div><small>Teplota</small><strong>'+esc(row[1])+'</strong></div><div><small>Doba zpracování</small><strong>'+esc(s)+' s</strong><em>'+esc(fmt(s))+(d?' (+'+esc(d)+' s)':'')+'</em></div>'
   +(s===0?'<p class="w">Ve zdrojové tabulce je u této hodnoty 0 s. Zkontrolujte ji.</p>':'')
   +(note?'<p class="n">'+esc(note)+'</p>':'');
 }else h='<p class="ph">'+esc(note||'Zvolte funkci, tloušťku a stupeň propečení.')+'</p>';
 $('#out').innerHTML=h;
 $('#tabbox').innerHTML=f?'<div class="gap"></div><h2>Celá tabulka: '+esc(S.fn)+'</h2><div class="tw"><table><thead><tr>'
  +f.h.map((x,i)=>'<th'+(i-3===S.lv?' class="col"':'')+'>'+esc(i===1?x+' (mm)':x)+'</th>').join('')
  +'</tr></thead><tbody>'
  +f.r.map((r,k)=>'<tr'+(k===hit?' class="hit"':'')+'>'+[S.fn,...r].map((c,i)=>'<td'+(i-3===S.lv?' class="col"':'')+'>'+esc(c)+'</td>').join('')+'</tr>').join('')
  +'</tbody></table></div>':'';
}
mk($('#fn'),K,'fn');
mk($('#lv'),D[K[0]].h.slice(3,7).map(x=>x.replace(/ \(s\)$/,'')),'lv');
$('#t').oninput=e=>{S.t=e.target.value===''?null:Math.round(+e.target.value);render()};
render();
</script>
</body>
</html>
